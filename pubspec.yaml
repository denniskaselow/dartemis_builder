version: 0.4.1
homepage: https://github.com/denniskaselow/dartemis_builder

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  analyzer: '>=10.0.0 <13.0.0'
  build: ^4.0.0
  build_config: ^1.0.0
  dartemis: ^0.10.0
  source_gen: ^4.0.1

dev_dependencies:
  build_test: ^3.4.0
  test: ^1.16.0
